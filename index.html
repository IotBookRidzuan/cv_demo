<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Vision Demo</title>
<style>
  :root{--bg:#0b1020;--fg:#e8ecf5;--muted:#8a93a8;--acc:#22d3ee;--card:#141a2e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h1{font-size:1.25rem;margin:4px 0 2px}
  p.sub{color:var(--muted);margin:0 0 12px;font-size:.9rem;text-align:center}
  .stage{position:relative;width:100%;max-width:720px;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
  button{background:var(--card);color:var(--fg);border:1px solid #2a3350;border-radius:10px;padding:10px 16px;font-size:.95rem;cursor:pointer}
  button.primary{background:var(--acc);color:#04202a;border:none;font-weight:600}
  button:disabled{opacity:.5}
  #status{color:var(--muted);font-size:.85rem;text-align:center;min-height:1.2em}
  #list{width:100%;max-width:720px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
  .tag{background:var(--card);border:1px solid #2a3350;border-radius:999px;padding:4px 10px;font-size:.85rem}
  footer{margin-top:auto;padding-top:16px;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>
  <h1>AI Vision Demo</h1>
  <p class="sub">Pengesanan objek masa nyata (COCO-SSD, 80 kelas) — semua diproses dalam peranti</p>

  <div class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="bar">
    <button id="start" class="primary">▶ Mula Kamera</button>
    <button id="flip" disabled>🔄 Tukar Kamera</button>
    <button id="snap" disabled>📸 Tangkap</button>
  </div>
  <div id="status">Tekan "Mula Kamera" untuk bermula.</div>
  <div id="list"></div>
  <footer>C-TeCH · Politeknik Ungku Omar</footer>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const btnStart = document.getElementById('start');
const btnFlip = document.getElementById('flip');
const btnSnap = document.getElementById('snap');

let model = null, stream = null, facing = 'environment', running = false, lastPreds = [];

async function loadModel(){
  if (model) return model;
  statusEl.textContent = 'Memuatkan model AI… (kali pertama mungkin 5–10 saat)';
  model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
  return model;
}

async function startCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  video.style.transform = canvas.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
}

function draw(preds){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lw = Math.max(2, canvas.width / 320);
  ctx.lineWidth = lw;
  ctx.font = `${Math.round(canvas.width / 40)}px system-ui, sans-serif`;
  preds.forEach(p => {
    const [x, y, w, h] = p.bbox;
    ctx.strokeStyle = '#22d3ee';
    ctx.strokeRect(x, y, w, h);
    const label = `${p.class} ${(p.score * 100).toFixed(0)}%`;
    const tw = ctx.measureText(label).width + 12;
    const th = parseInt(ctx.font) + 8;
    ctx.fillStyle = '#22d3ee';
    ctx.fillRect(x, Math.max(0, y - th), tw, th);
    ctx.fillStyle = '#04202a';
    ctx.save();
    if (facing === 'user') { /* keep text readable when mirrored */
      ctx.translate(x + tw / 2, 0); ctx.scale(-1, 1); ctx.translate(-(x + tw / 2), 0);
    }
    ctx.fillText(label, x + 6, Math.max(th - 8, y - 8));
    ctx.restore();
  });
}

function updateList(preds){
  const counts = {};
  preds.forEach(p => counts[p.class] = (counts[p.class] || 0) + 1);
  listEl.innerHTML = '';
  Object.entries(counts).forEach(([k, v]) => {
    const s = document.createElement('span');
    s.className = 'tag';
    s.textContent = `${k} × ${v}`;
    listEl.appendChild(s);
  });
}

async function loop(){
  if (!running) return;
  if (video.readyState >= 2) {
    lastPreds = await model.detect(video, 20, 0.5);
    draw(lastPreds);
    updateList(lastPreds);
    statusEl.textContent = lastPreds.length ? `${lastPreds.length} objek dikesan` : 'Tiada objek dikesan';
  }
  requestAnimationFrame(loop);
}

btnStart.onclick = async () => {
  btnStart.disabled = true;
  try {
    await startCamera();
    await loadModel();
    running = true;
    btnFlip.disabled = btnSnap.disabled = false;
    btnStart.textContent = '● Sedang Berjalan';
    loop();
  } catch (e) {
    btnStart.disabled = false;
    statusEl.textContent = 'Gagal akses kamera: ' + e.message + ' — pastikan laman dibuka melalui https dan kebenaran kamera diberi.';
  }
};

btnFlip.onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (e) { statusEl.textContent = 'Tak dapat tukar kamera: ' + e.message; }
};

btnSnap.onclick = () => {
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const o = out.getContext('2d');
  if (facing === 'user') { o.translate(out.width, 0); o.scale(-1, 1); }
  o.drawImage(video, 0, 0);
  o.drawImage(canvas, 0, 0);
  const a = document.createElement('a');
  a.download = 'ai-vision-' + Date.now() + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
};
</script>
</body>
</html>
